<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101021">
  <title>Contact · Hello, world!</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f7f4ff; background: #101021; } * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; background: radial-gradient(ellipse at 15% 8%, #7c3aed3d, transparent 37%), radial-gradient(ellipse at 88% 88%, #06b6d42e, transparent 38%), #101021; }
    main { width: min(100%, 760px); padding: clamp(2rem, 7vw, 4.75rem); border: 1px solid #ffffff20; border-radius: 30px; background: linear-gradient(145deg, #ffffff11, #ffffff05); box-shadow: 0 30px 100px #0007, inset 0 1px #ffffff17; backdrop-filter: blur(18px); animation: rise .7s ease both; }
    nav { display: flex; gap: 1.1rem; margin-bottom: 3.5rem; } nav a { color: #c8c3d9; font-size: .88rem; font-weight: 650; text-decoration: none; } nav a:hover, nav a:focus-visible, nav a[aria-current] { color: #fff; }
    .eyebrow { color: #f5c76a; font-size: .76rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; } h1 { margin: .7rem 0 .9rem; font-size: clamp(3rem, 9vw, 5.8rem); line-height: 1; letter-spacing: -.07em; } h1 span { color: transparent; background: linear-gradient(100deg, #c4b5fd, #f0abfc, #67e8f9); background-clip: text; -webkit-background-clip: text; }
    p { color: #b9b6c9; font-size: 1.1rem; line-height: 1.7; } form { display: grid; gap: 1rem; margin-top: 2rem; } label { display: grid; gap: .45rem; color: #ddd8ea; font-size: .9rem; font-weight: 650; } input, textarea { width: 100%; padding: .85rem 1rem; border: 1px solid #ffffff22; border-radius: 12px; color: #f7f4ff; background: #09091655; font: inherit; } textarea { min-height: 8rem; resize: vertical; } input:focus, textarea:focus { outline: 2px solid #c4b5fd; outline-offset: 2px; } button { justify-self: start; padding: .9rem 1.25rem; border: 0; border-radius: 14px; color: #171326; background: linear-gradient(110deg, #c4b5fd, #f0abfc 55%, #a5f3fc); font: inherit; font-weight: 750; cursor: pointer; } #status { min-height: 1.5em; margin: .2rem 0 0; color: #a5f3fc; font-size: .92rem; } @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="projects.html">Projects</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <div class="eyebrow">✦ Get in touch</div>
    <h1>Say <span>hello.</span></h1>
    <p>Have an idea, a question, or simply want to connect? Leave a note below.</p>
    <form id="contact-form">
      <label>Name <input name="name" autocomplete="name" required></label>
      <label>Email <input type="email" name="email" autocomplete="email" required></label>
      <label>Message <textarea name="message" required></textarea></label>
      <button type="submit">Send message ↗</button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script>
    document.querySelector('#contact-form').addEventListener('submit', (event) => {
      event.preventDefault();
      event.currentTarget.reset();
      document.querySelector('#status').textContent = 'Thanks — your note is ready to send.';
    });
  </script>
</body>
</html>
