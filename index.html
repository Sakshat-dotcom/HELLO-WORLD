<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101021">
  <title>Hello, world!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101021;
      color: #f7f4ff;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 18% 15%, #7c3aed38, transparent 36%),
        radial-gradient(ellipse at 85% 78%, #06b6d42b, transparent 34%),
        #101021;
    }
    .orb {
      position: fixed;
      width: 25rem;
      aspect-ratio: 1;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .28;
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate;
    }
    .orb.one { background: #8b5cf6; top: -12rem; left: -9rem; }
    .orb.two { background: #22d3ee; right: -12rem; bottom: -15rem; animation-delay: -5s; }
    main {
      position: relative;
      width: min( min(100% - 2rem, 760px), 760px);
      padding: clamp(2rem, 7vw, 4.75rem);
      text-align: center;
      border: 1px solid #ffffff20;
      border-radius: 30px;
      background: linear-gradient(145deg, #ffffff11, #ffffff05);
      box-shadow: 0 30px 100px #0007, inset 0 1px #ffffff17;
      backdrop-filter: blur(18px);
      animation: rise .9s cubic-bezier(.2,.8,.2,1) both;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .55rem .9rem;
      border: 1px solid #ffffff20;
      border-radius: 999px;
      background: #ffffff0a;
      color: #c8c3d9;
      font-size: .76rem;
      font-weight: 650;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .spark { color: #f5c76a; font-size: .9rem; }
    h1 {
      margin: 1.6rem 0 .9rem;
      font-size: clamp(3.5rem, 11vw, 7.2rem);
      line-height: .98;
      letter-spacing: -.075em;
      font-weight: 800;
    }
    h1 span {
      display: block;
      color: transparent;
      background: linear-gradient(100deg, #c4b5fd 8%, #f0abfc 48%, #67e8f9 92%);
      background-clip: text;
      -webkit-background-clip: text;
    }
    p { max-width: 29rem; margin: 0 auto; color: #b9b6c9; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.7; }
    button {
      margin-top: 2rem;
      padding: .9rem 1.35rem;
      border: 0;
      border-radius: 14px;
      color: #171326;
      background: linear-gradient(110deg, #c4b5fd, #f0abfc 55%, #a5f3fc);
      box-shadow: 0 8px 30px #c084fc35;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 13px 34px #c084fc55; }
    button:active { transform: translateY(0) scale(.98); }
    button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    .note { display: block; margin-top: 2.4rem; color: #777489; font-size: .78rem; letter-spacing: .04em; }
    @keyframes rise { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate(4rem, 3rem) scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <main>
    <div class="eyebrow"><span class="spark" aria-hidden="true">✦</span> A tiny beginning</div>
    <h1>Hello,<span>world!</span></h1>
    <p>A little page with a lot of possibility. Here’s to whatever you build next.</p>
    <button id="hello-button" type="button">Say hello <span aria-hidden="true">↗</span></button>
    <small class="note">Made with curiosity&nbsp; · &nbsp;HTML, CSS &amp; a little JavaScript</small>
  </main>
  <script>
    const button = document.querySelector('#hello-button');
    button.addEventListener('click', () => {
      button.innerHTML = 'Hello, you! <span aria-hidden="true">✦</span>';
    });
  </script>
</body>
</html>
